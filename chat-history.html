<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat History | AI Help Desk</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f7fb;
            color: #1f2937;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 230px;
            height: 100vh;

            background: #111827;
            color: white;

            padding: 25px 15px;
        }


        .logo {
            text-align: center;

            font-size: 20px;
            font-weight: bold;

            margin-bottom: 30px;
        }


        .menu {
            list-style: none;
        }


        .menu li {
            margin-bottom: 10px;
        }


        .menu a {
            display: block;

            padding: 13px;

            color: #d1d5db;

            text-decoration: none;

            border-radius: 8px;

            transition: 0.3s;
        }


        .menu a:hover,
        .menu a.active {
            background: #2563eb;
            color: white;
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 230px;
            padding: 30px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }


        .header h1 {
            font-size: 28px;
        }


        .header p {
            margin-top: 8px;
            color: #6b7280;
        }


        /* =========================
           ACTION BUTTONS
        ========================= */

        .actions {
            display: flex;
            gap: 10px;
        }


        .btn {
            border: none;

            padding: 12px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;

            font-weight: bold;

            transition: 0.3s;
        }


        .ask-btn {
            background: #2563eb;
            color: white;
        }


        .ask-btn:hover {
            background: #1d4ed8;
        }


        .clear-btn {
            background: #dc2626;
            color: white;
        }


        .clear-btn:hover {
            background: #b91c1c;
        }


        /* =========================
           HISTORY CONTAINER
        ========================= */

        .history-container {
            background: white;

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.08);
        }


        /* =========================
           CHAT ITEM
        ========================= */

        .chat-item {
            padding: 18px;

            margin-bottom: 15px;

            border-radius: 12px;

            border:
                1px solid #e5e7eb;

            transition: 0.3s;
        }


        .chat-item:hover {
            transform: translateY(-2px);

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.05);
        }


        .chat-top {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 10px;
        }


        .sender {
            font-weight: bold;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 13px;
        }


        .student {
            background: #dbeafe;
            color: #1d4ed8;
        }


        .bot {
            background: #dcfce7;
            color: #15803d;
        }


        .system {
            background: #ede9fe;
            color: #6d28d9;
        }


        .date {
            color: #6b7280;

            font-size: 13px;
        }


        .chat-message {
            font-size: 16px;

            line-height: 1.6;

            white-space: pre-line;

            color: #374151;
        }


        /* =========================
           EMPTY STATE
        ========================= */

        .empty-history {
            text-align: center;

            padding: 60px 20px;

            color: #6b7280;
        }


        .empty-history .icon {
            font-size: 55px;

            margin-bottom: 15px;
        }


        .empty-history h2 {
            color: #374151;

            margin-bottom: 10px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .sidebar {
                width: 70px;
            }


            .logo {
                font-size: 0;
            }


            .logo::after {
                content: "🎓";
                font-size: 25px;
            }


            .menu a {
                font-size: 0;
                text-align: center;
            }


            .main {
                margin-left: 70px;
                padding: 15px;
            }


            .header {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }


            .actions {
                width: 100%;

                flex-direction: column;
            }


            .btn {
                width: 100%;
            }


            .chat-top {
                flex-direction: column;

                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">


        <div class="logo">
            🎓 AI Help Desk
        </div>


        <ul class="menu">


            <li>
                <a href="student-dashboard.html">
                    📊 Dashboard
                </a>
            </li>


            <li>
                <a href="chatbot.html">
                    🤖 Ask AI
                </a>
            </li>


            <li>
                <a href="tickets.html">
                    🎫 My Tickets
                </a>
            </li>


            <li>
                <a
                    href="chat-history.html"
                    class="active"
                >
                    💬 Chat History
                </a>
            </li>


            <li>
                <a href="notifications.html">
                    🔔 Notifications
                </a>
            </li>


            <li>
                <a href="login.html">
                    🚪 Logout
                </a>
            </li>


        </ul>


    </aside>



    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">


        <!-- HEADER -->

        <div class="header">


            <div>

                <h1>
                    💬 Chat History
                </h1>


                <p>
                    View all your previous conversations
                    with the AI Student Assistant.
                </p>

            </div>


            <div class="actions">


                <button
                    class="btn ask-btn"
                    onclick="goToChat()"
                >
                    🤖 Ask AI
                </button>


                <button
                    class="btn clear-btn"
                    onclick="clearHistory()"
                >
                    🗑 Clear History
                </button>


            </div>


        </div>



        <!-- CHAT HISTORY -->

        <section
            class="history-container"
            id="historyContainer"
        >

            Loading chat history...

        </section>


    </main>



    <script>


        /* ===============================
           STORAGE KEY
        =============================== */

        const CONVERSATION_KEY =
            "conversations";



        /* ===============================
           GET STUDENT DETAILS
        =============================== */

        function getStudentDetails() {


            const name =
                localStorage.getItem(
                    "studentName"
                )
                ||
                localStorage.getItem(
                    "username"
                )
                ||
                "Student";


            const email =
                localStorage.getItem(
                    "studentEmail"
                )
                ||
                localStorage.getItem(
                    "currentUserEmail"
                )
                ||
                "";


            return {
                name: name,
                email: email
            };

        }



        /* ===============================
           GET CONVERSATIONS
        =============================== */

        function getConversations() {


            try {


                const data =
                    localStorage.getItem(
                        CONVERSATION_KEY
                    );


                if (!data) {

                    return [];

                }


                const conversations =
                    JSON.parse(data);


                return Array.isArray(
                    conversations
                )
                    ? conversations
                    : [];


            }
            catch (error) {


                console.error(
                    "Chat history loading error:",
                    error
                );


                return [];


            }

        }



        /* ===============================
           GET STUDENT CHAT HISTORY
        =============================== */

        function getStudentConversations() {


            const student =
                getStudentDetails();


            const conversations =
                getConversations();


            /* If email exists,
               show only current student's chats */

            if (student.email !== "") {


                return conversations.filter(
                    function (conversation) {


                        return (
                            conversation.studentEmail ===
                            student.email
                        );


                    }
                );


            }


            /* Fallback using student name */

            return conversations.filter(
                function (conversation) {


                    return (
                        conversation.studentName ===
                        student.name
                    );


                }
            );

        }



        /* ===============================
           ESCAPE HTML
        =============================== */

        function escapeHTML(text) {


            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text || "";


            return div.innerHTML;

        }



        /* ===============================
           GET SENDER DETAILS
        =============================== */

        function getSenderDetails(sender) {


            if (sender === "student") {


                return {
                    label: "👤 You",
                    className: "student"
                };


            }


            if (sender === "bot") {


                return {
                    label: "🤖 AI Assistant",
                    className: "bot"
                };


            }


            return {
                label: "⚙ System",
                className: "system"
            };

        }



        /* ===============================
           LOAD CHAT HISTORY
        =============================== */

        function loadChatHistory() {


            const container =
                document.getElementById(
                    "historyContainer"
                );


            const conversations =
                getStudentConversations();


            container.innerHTML =
                "";


            /* EMPTY HISTORY */

            if (
                conversations.length === 0
            ) {


                container.innerHTML =
                    `
                    <div class="empty-history">

                        <div class="icon">
                            💬
                        </div>

                        <h2>
                            No Chat History Yet
                        </h2>

                        <p>
                            Start a conversation with
                            the AI Student Assistant.
                        </p>

                    </div>
                    `;


                return;

            }



            /* NEWEST FIRST */

            conversations
                .slice()
                .reverse()
                .forEach(
                    function (conversation) {


                        const sender =
                            getSenderDetails(
                                conversation.sender
                            );


                        const chatItem =
                            document.createElement(
                                "div"
                            );


                        chatItem.className =
                            "chat-item";


                        chatItem.innerHTML =
                            `
                            <div class="chat-top">

                                <span
                                    class="
                                        sender
                                        ${sender.className}
                                    "
                                >
                                    ${sender.label}
                                </span>


                                <span
                                    class="date"
                                >
                                    ${escapeHTML(
                                        conversation.date
                                    )}
                                </span>

                            </div>


                            <div
                                class="chat-message"
                            >
                                ${escapeHTML(
                                    conversation.message
                                )}
                            </div>
                            `;


                        container.appendChild(
                            chatItem
                        );


                    }
                );

        }



        /* ===============================
           GO TO CHAT
        =============================== */

        function goToChat() {


            window.location.href =
                "chatbot.html";

        }



        /* ===============================
           CLEAR CHAT HISTORY
        =============================== */

        function clearHistory() {


            const student =
                getStudentDetails();


            const confirmClear =
                confirm(
                    "Are you sure you want to clear your chat history?"
                );


            if (!confirmClear) {

                return;

            }


            const conversations =
                getConversations();


            /* Remove only current
               student's conversations */

            const updatedConversations =
                conversations.filter(
                    function (conversation) {


                        if (
                            student.email !== ""
                        ) {


                            return (
                                conversation.studentEmail !==
                                student.email
                            );


                        }


                        return (
                            conversation.studentName !==
                            student.name
                        );


                    }
                );


            localStorage.setItem(

                CONVERSATION_KEY,

                JSON.stringify(
                    updatedConversations
                )

            );


            loadChatHistory();

        }



        /* ===============================
           INITIAL LOAD
        =============================== */

        loadChatHistory();


    </script>


</body>

</html>
