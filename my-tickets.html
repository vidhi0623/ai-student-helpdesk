<title>My Tickets | AI Help Desk</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f7fb;
        color: #1f2937;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 240px;
        height: 100vh;
        background: #111827;
        color: white;
        padding: 25px 15px;
    }

    .logo {
        text-align: center;
        font-size: 21px;
        font-weight: bold;
        margin-bottom: 35px;
    }

    .menu {
        list-style: none;
    }

    .menu li {
        margin-bottom: 10px;
    }

    .menu a {
        display: block;
        padding: 13px;
        color: #d1d5db;
        text-decoration: none;
        border-radius: 8px;
    }

    .menu a:hover,
    .menu a.active {
        background: #2563eb;
        color: white;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
        margin-left: 240px;
        padding: 30px;
    }

    h1 {
        margin-bottom: 8px;
    }

    .subtitle {
        color: #6b7280;
        margin-bottom: 25px;
    }

    /* =========================
       TOP BAR
    ========================= */

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }

    .ticket-count {
        background: white;
        padding: 15px 20px;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0,0,0,.07);
        font-weight: bold;
    }

    .refresh-btn {
        background: #2563eb;
        color: white;
        border: none;
        padding: 11px 18px;
        border-radius: 7px;
        cursor: pointer;
        font-weight: bold;
    }

    .refresh-btn:hover {
        background: #1d4ed8;
    }

    /* =========================
       TICKETS
    ========================= */

    .tickets-container {
        display: grid;
        gap: 20px;
    }

    .ticket-card {
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .ticket-header {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 15px;
        flex-wrap: wrap;
    }

    .ticket-id {
        color: #2563eb;
        font-size: 18px;
        font-weight: bold;
    }

    .status {
        padding: 7px 13px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
    }

    .open {
        background: #fef3c7;
        color: #92400e;
    }

    .pending {
        background: #dbeafe;
        color: #1e40af;
    }

    .resolved {
        background: #dcfce7;
        color: #166534;
    }

    .ticket-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
        margin-top: 15px;
    }

    .info-box {
        background: #f8fafc;
        padding: 15px;
        border-radius: 8px;
    }

    .label {
        color: #6b7280;
        font-size: 12px;
        margin-bottom: 6px;
        font-weight: bold;
    }

    .value {
        line-height: 1.5;
    }

    /* =========================
       REPLIES
    ========================= */

    .reply-section {
        margin-top: 20px;
        border-top: 1px solid #e5e7eb;
        padding-top: 18px;
    }

    .reply-section h3 {
        margin-bottom: 12px;
    }

    .reply {
        background: #f5f3ff;
        border-left: 4px solid #7c3aed;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
    }

    .reply-message {
        line-height: 1.6;
        margin-bottom: 8px;
    }

    .reply-meta {
        color: #6b7280;
        font-size: 12px;
    }

    .no-reply {
        color: #6b7280;
        font-size: 14px;
        padding: 12px;
        background: #f8fafc;
        border-radius: 8px;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
        background: white;
        padding: 60px 25px;
        text-align: center;
        border-radius: 12px;
        color: #6b7280;
        box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .empty h2 {
        margin-bottom: 12px;
        color: #374151;
    }

    .create-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 7px;
        font-weight: bold;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:700px) {

        .sidebar {
            width: 70px;
        }

        .logo {
            font-size: 0;
        }

        .logo::after {
            content: "🎓";
            font-size: 25px;
        }

        .menu a {
            font-size: 0;
            text-align: center;
        }

        .main {
            margin-left: 70px;
            padding: 15px;
        }

        .top-bar {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        .ticket-grid {
            grid-template-columns: 1fr;
        }

    }

</style>

```

<!-- =========================
     MAIN
========================== -->

<main class="main">

    <h1>🎫 My Support Tickets</h1>

    <p class="subtitle">
        View your submitted tickets, status and admin replies.
    </p>


    <div class="top-bar">

        <div class="ticket-count">

            Total My Tickets:
            <span id="ticketCount">
                0
            </span>

        </div>


        <button
            class="refresh-btn"
            onclick="loadMyTickets()"
        >
            🔄 Refresh
        </button>

    </div>


    <div
        id="ticketsContainer"
        class="tickets-container"
    ></div>

</main>


<script>

    /* =========================
       STORAGE KEY
    ========================= */

    const TICKET_KEY =
        "tickets";


    /* =========================
       GET TICKETS
    ========================= */

    function getTickets() {

        try {

            const data =
                localStorage.getItem(
                    TICKET_KEY
                );


            if (!data) {

                return [];

            }


            const tickets =
                JSON.parse(data);


            return Array.isArray(
                tickets
            )
                ? tickets
                : [];

        }

        catch(error) {

            console.error(
                "Error loading tickets:",
                error
            );


            return [];

        }

    }


    /* =========================
       GET CURRENT STUDENT EMAIL

       This tries multiple common
       login storage keys.
    ========================= */

    function getCurrentStudentEmail() {

        const possibleKeys = [

            "studentEmail",

            "userEmail",

            "currentUser",

            "loggedInUser",

            "loggedInEmail",

            "user"

        ];


        for (

            let i = 0;

            i < possibleKeys.length;

            i++

        ) {

            const key =
                possibleKeys[i];


            const value =
                localStorage.getItem(
                    key
                );


            if (!value) {

                continue;

            }


            /* Direct email */

            if (

                value.includes(
                    "@"
                )

            ) {

                return value;

            }


            /* JSON user object */

            try {

                const user =
                    JSON.parse(
                        value
                    );


                if (

                    user &&
                    user.email

                ) {

                    return user.email;

                }

            }

            catch(error) {

                /* Continue */

            }

        }


        return null;

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(text) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            text ?? "";


        return div.innerHTML;

    }


    /* =========================
       GET STATUS CLASS
    ========================= */

    function getStatusClass(status) {

        if (
            status === "Pending"
        ) {

            return "pending";

        }


        if (
            status === "Resolved"
        ) {

            return "resolved";

        }


        return "open";

    }


    /* =========================
       LOAD MY TICKETS
    ========================= */

    function loadMyTickets() {

        const allTickets =
            getTickets();


        const studentEmail =
            getCurrentStudentEmail();


        /*
           If email is available,
           show only that student's
           tickets.

           Otherwise show all tickets
           so the page still works
           during local testing.
        */

        let myTickets;


        /*
=================================
LOAD TICKETS SAFELY
=================================

Some old tickets may not have
an email field.

During this localStorage prototype,
show all available tickets if no
matching email ticket is found.
*/

const matchedTickets =
    studentEmail
        ? allTickets.filter(
            function(ticket) {

                const ticketEmail =
                    ticket.email ||
                    ticket.studentEmail ||
                    "";

                return (
                    ticketEmail
                        .toLowerCase()
                        .trim() ===
                    studentEmail
                        .toLowerCase()
                        .trim()
                );

            }
        )
        : [];


/*
If matching tickets exist,
show only those tickets.

Otherwise show existing tickets
so older tickets created before
the email system still appear.
*/

if (
    matchedTickets.length > 0
) {

    myTickets =
        matchedTickets;

}

else {

    myTickets =
        allTickets;

}


        document.getElementById(
            "ticketCount"
        ).innerText =
            myTickets.length;


        const container =
            document.getElementById(
                "ticketsContainer"
            );


        container.innerHTML =
            "";


        /* EMPTY */

        if (
            myTickets.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">

                    <h2>
                        🎫 No Tickets Found
                    </h2>

                    <p>
                        You have not created
                        any support tickets yet.
                    </p>

                    <a
                        href="chatbot.html"
                        class="create-btn"
                    >
                        🤖 Get AI Help
                    </a>

                </div>

            `;


            return;

        }


        /*
           NEWEST TICKET FIRST
        */

        myTickets
            .slice()
            .reverse()
            .forEach(
                function(ticket) {


                    const status =
                        ticket.status ||
                        "Open";


                    const statusClass =
                        getStatusClass(
                            status
                        );


                    const assignedTo =
                        ticket.assignedTo ||
                        "Not assigned yet";


                    const replies =
                        Array.isArray(
                            ticket.replies
                        )
                            ? ticket.replies
                            : [];


                    let repliesHTML =
                        "";


                    if (
                        replies.length === 0
                    ) {

                        repliesHTML = `

                            <div
                                class="no-reply"
                            >

                                💬 No admin reply yet.

                            </div>

                        `;

                    }

                    else {

                        replies.forEach(
                            function(reply) {

                                repliesHTML += `

                                    <div
                                        class="reply"
                                    >

                                        <div
                                            class="reply-message"
                                        >

                                            ${escapeHTML(
                                                reply.message
                                            )}

                                        </div>


                                        <div
                                            class="reply-meta"
                                        >

                                            👤 ${escapeHTML(
                                                reply.sender ||
                                                "Admin"
                                            )}

                                            •

                                            🕒 ${escapeHTML(
                                                reply.date ||
                                                ""
                                            )}

                                        </div>

                                    </div>

                                `;

                            }
                        );

                    }


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "ticket-card";


                    card.innerHTML = `

                        <div
                            class="ticket-header"
                        >

                            <div
                                class="ticket-id"
                            >

                                🎫 ${escapeHTML(
                                    ticket.id ||
                                    "Ticket"
                                )}

                            </div>


                            <span
                                class="
                                    status
                                    ${statusClass}
                                "
                            >

                                ${escapeHTML(
                                    status
                                )}

                            </span>

                        </div>


                        <div
                            class="ticket-grid"
                        >


                            <div
                                class="info-box"
                            >

                                <div
                                    class="label"
                                >

                                    SUBJECT

                                </div>


                                <div
                                    class="value"
                                >

                                    ${escapeHTML(
                                        ticket.subject ||
                                        "-"
                                    )}

                                </div>

                            </div>



                            <div
                                class="info-box"
                            >

                                <div
                                    class="label"
                                >

                                    DEPARTMENT

                                </div>


                                <div
                                    class="value"
                                >

                                    ${escapeHTML(
                                        ticket.department ||
                                        ticket.category ||
                                        "-"
                                    )}

                                </div>

                            </div>



                            <div
                                class="info-box"
                            >

                                <div
                                    class="label"
                                >

                                    ASSIGNED TO

                                </div>


                                <div
                                    class="value"
                                >

                                    👤 ${escapeHTML(
                                        assignedTo
                                    )}

                                </div>

                            </div>



                            <div
                                class="info-box"
                            >

                                <div
                                    class="label"
                                >

                                    CREATED DATE

                                </div>


                                <div
                                    class="value"
                                >

                                    🕒 ${escapeHTML(
                                        ticket.date ||
                                        "Not available"
                                    )}

                                </div>

                            </div>



                            <div
                                class="info-box"
                                style="
                                    grid-column:
                                    1 / -1;
                                "
                            >

                                <div
                                    class="label"
                                >

                                    YOUR DESCRIPTION

                                </div>


                                <div
                                    class="value"
                                >

                                    ${escapeHTML(
                                        ticket.description ||
                                        "No description"
                                    )}

                                </div>

                            </div>


                        </div>


                        <div
                            class="reply-section"
                        >

                            <h3>
                                💬 Admin Replies
                            </h3>


                            ${repliesHTML}

                        </div>

                    `;


                    container.appendChild(
                        card
                    );


                }
            );

    }


    /* =========================
       INITIAL LOAD
    ========================= */

    loadMyTickets();


    /* =========================
       AUTO UPDATE
    ========================= */

    window.addEventListener(
        "storage",
        function(event) {

            if (
                event.key ===
                TICKET_KEY
            ) {

                loadMyTickets();

            }

        }
    );


    /*
       Refresh automatically
       during testing.
    */

    setInterval(
        loadMyTickets,
        1500
    );

</script>
